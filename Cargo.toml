[package]
name = "copse"
version = "0.1.1"
edition = "2024"
description = "Terminal board for tracking work across worktrees"
authors = ["zacd1302-ops"]
license = "MIT"
repository = "https://github.com/zacd1302-ops/copse"
readme = "README.md"
keywords = ["terminal", "git", "worktree", "tui"]
categories = ["development-tools"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream"] }
futures = "0.3.34"
pulldown-cmark = "0.13.4"
ratatui = "0.30"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
toml = "1.1.4"
uuid = { version = "1.26.0", features = ["v4"] }

[dev-dependencies]
tempfile = "3.27.0"
